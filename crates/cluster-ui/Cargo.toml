[package]
name = "cluster-ui"
description = "Slint widget library and dashboard rendering shared by desktop and web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cluster-core.workspace = true
cluster-layout.workspace = true
slint.workspace = true
log.workspace = true
png = { version = "0.18", optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = []
# Headless rendering to PNG (snapshots, CI, dashboard thumbnails).
offscreen = ["slint/renderer-software", "slint/software-renderer-path", "dep:png", "dep:anyhow"]

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

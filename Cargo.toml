[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
cluster-core = { path = "crates/cluster-core" }
source-demo = { path = "crates/source-demo" }
cluster-ui = { path = "crates/cluster-ui" }
cluster-layout = { path = "crates/cluster-layout" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "1.3"
notify = "8"
arc-swap = "1.9"
web-time = "1"
slint = "1.18"
slint-build = "1.18"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

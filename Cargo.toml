[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/Alexxfromgit/DashCluster"
homepage = "https://github.com/Alexxfromgit/DashCluster"

[workspace.dependencies]
cluster-core = { path = "crates/cluster-core" }
source-demo = { path = "crates/source-demo" }
source-forza = { path = "crates/source-forza" }
cluster-ui = { path = "crates/cluster-ui" }
cluster-layout = { path = "crates/cluster-layout" }
cluster-net = { path = "crates/cluster-net" }
source-net = { path = "crates/source-net" }

anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.3"
notify = "8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mdns-sd = "0.21"
qrcode = { version = "0.14", default-features = false }
tungstenite = "0.30"
arc-swap = "1.9"
web-time = "1"
slint = "1.18"
slint-build = "1.18"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Web display build (scripts/build-web.sh): small, and keeps wasm-bindgen's metadata.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = false

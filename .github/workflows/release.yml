name: Release

# Every push to main updates the Release Please PR (version bump + CHANGELOG.md, from Conventional
# Commit PR titles). Merging that PR creates the vX.Y.Z tag and a draft GitHub release; the same run
# then builds, tests and packages Windows, macOS and Linux (each with the phone display built in),
# starts each packaged app once, uploads the files with checksums and build provenance, and
# publishes the release.
#
# Run it by hand with an existing tag to rebuild and replace that release's files.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, e.g. v0.2.0
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    # Forks run CI but never cut releases.
    if: github.event_name == 'push' && github.repository == 'Alexxfromgit/DashCluster'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A PAT or GitHub App token, so CI runs on the release PR (PRs opened with GITHUB_TOKEN
          # trigger no workflows). Falls back to GITHUB_TOKEN, which works apart from that.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    needs: release-please
    if: >-
      ${{ !cancelled() && github.repository == 'Alexxfromgit/DashCluster' &&
          (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # draft releases are only visible with write access
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - id: info
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
          { echo "tag=$TAG"; echo "version=${TAG#v}"; } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          # The oldest supported runner, so the binary runs on glibc 2.35+ (Ubuntu 22.04, Debian 12, …).
          - { name: Linux, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libxkbcommon-dev

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      # Start the packaged app the way users get it: it renders a dashboard headlessly and quits.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'dashcluster'
          Expand-Archive "dist/DashCluster-$env:VERSION-windows.zip" $dir
          $shot = Join-Path $env:RUNNER_TEMP 'windows.png'
          $p = Start-Process (Join-Path $dir 'DashCluster.exe') -PassThru -ArgumentList 'snapshot', '--out', $shot
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'the packaged app did not quit' }
          if ($p.ExitCode -ne 0) { throw "the packaged app exited with $($p.ExitCode)" }
          if (-not (Test-Path $shot)) { throw 'no snapshot written' }

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 dist/DashCluster.app
          perl -e 'alarm shift; exec @ARGV' 120 dist/DashCluster.app/Contents/MacOS/dashcluster snapshot --out "$RUNNER_TEMP/macos.png"
          test -s "$RUNNER_TEMP/macos.png"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "dist/DashCluster-$VERSION-linux-x64.tar.gz" -C "$RUNNER_TEMP/app"
          timeout 120 "$RUNNER_TEMP/app/DashCluster/dashcluster" snapshot --out "$RUNNER_TEMP/linux.png"
          test -s "$RUNNER_TEMP/linux.png"

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p stage
          cp dist/DashCluster-"$VERSION"-* stage/

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: stage
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # build provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: assets
          merge-multiple: true

      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed provenance for every download (verify with `gh attestation verify <file> -R <repo>`).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*

      - name: Upload assets
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # A rebuild replaces everything, so no stale file from the earlier build is left behind.
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
              while read -r name; do gh release delete-asset "$TAG" "$name" -R "$GITHUB_REPOSITORY" --yes; done
          fi
          gh release upload "$TAG" assets/* --clobber -R "$GITHUB_REPOSITORY"

      - name: Publish release
        run: |
          if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          echo "### Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

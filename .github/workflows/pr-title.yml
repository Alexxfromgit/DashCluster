name: PR title

# PRs are squash-merged, so the title becomes the commit on main that Release Please reads:
# feat → minor release, fix/perf/deps → patch, "!" or a BREAKING CHANGE footer → breaking.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # Dependabot writes "deps: Bump …"; its titles are generated, not written for the changelog.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            docs
            refactor
            test
            build
            ci
            chore
            style
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            Start the subject "{subject}" with a lower-case letter, e.g. "feat: add a boost gauge widget".
